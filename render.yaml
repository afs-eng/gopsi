services:
  - type: web
    name: gopsi-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: gopsi.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://gopsi.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://gopsi.vercel.app
      - key: FRONTEND_BASE_URL
        value: https://gopsi.vercel.app
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DATABASE_URL
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DRF_ANON_THROTTLE_RATE
        value: 60/min
      - key: DRF_USER_THROTTLE_RATE
        value: 1000/hour
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      - key: MFA_ISSUER
        value: GoPsi
