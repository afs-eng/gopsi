services:
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3001:3000"
    depends_on:
      - web

  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000 --noreload
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgres://plataforma_psi:plataforma_psi@postgres:5432/plataforma_psi
    volumes:
      - .:/app
      - web_venv:/app/.venv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plataforma_psi
      POSTGRES_USER: plataforma_psi
      POSTGRES_PASSWORD: plataforma_psi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma_psi -d plataforma_psi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    command: uv run celery -A config worker -l INFO
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgres://plataforma_psi:plataforma_psi@postgres:5432/plataforma_psi
    volumes:
      - .:/app
      - celery_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: .
    command: uv run celery -A config beat -l INFO
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgres://plataforma_psi:plataforma_psi@postgres:5432/plataforma_psi
    volumes:
      - .:/app
      - celery_beat_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
  web_venv:
  celery_venv:
  celery_beat_venv:
